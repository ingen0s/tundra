name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build: [release, asan]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev
      - name: Build
        run: |
          if [ "${{ matrix.build }}" = "asan" ]; then make asan; else make; fi
      - name: Codec unit tests
        run: ./build/codec_test
      - name: Integration tests
        run: ./tests/integration.sh
      - name: Smoke test
        run: python3 tests/smoke.py build/tundra_chat_server

  fuzz:
    # pinned so clang and libclang-rt-18-dev stay the same version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-18 libclang-rt-18-dev
      - name: Fuzz the codec for 60 seconds
        run: make fuzz-run FUZZ_TIME=60
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            timeout-*

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev
          cd tests/web && npm install
      - name: Build
        run: make
      - name: Web client in jsdom
        run: ./tests/web_ui.sh

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev
      - name: TypeScript SDK against a live server
        run: ./tests/ts_sdk.sh

  no-tls:
    # the build without OpenSSL still works and refuses -C/-K clearly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Build without TLS
        run: make TLS=0
      - name: Integration tests (TLS section skipped)
        run: ./tests/integration.sh

  linux-poll:
    # the portable poll() backend that Windows uses, exercised on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev
      - name: Build with the poll() backend and sanitizers
        run: make all CFLAGS="-O1 -g -DTUNDRA_POLLER_POLL" SANFLAGS="-fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all"
      - name: Integration tests
        run: ./tests/integration.sh
      - name: Smoke test (120 clients, slow reader)
        run: python3 tests/smoke.py build/tundra_chat_server

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install openssl@3 pkg-config
      - name: Build
        run: PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig" make
      - name: Codec unit tests
        run: ./build/codec_test
      - name: Integration tests
        run: ./tests/integration.sh
      - name: Smoke test
        run: python3 tests/smoke.py build/tundra_chat_server

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-python
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-pkgconf
      - name: Build
        run: make
      - name: Check TLS is built in
        run: ./build/tundra_chat_server.exe -h 2>&1 | grep -- "-C  TLS"
      - name: Codec unit tests
        run: ./build/codec_test.exe
      - name: Smoke test
        run: python tests/smoke.py build/tundra_chat_server.exe
