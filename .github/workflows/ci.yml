name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build: [release, asan]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y uuid-dev libsqlite3-dev
      - name: Build
        run: |
          if [ "${{ matrix.build }}" = "asan" ]; then make asan; else make; fi
      - name: Codec unit tests
        run: ./build/codec_test
      - name: Integration tests
        run: ./tests/integration.sh

  fuzz:
    # pinned so clang and libclang-rt-18-dev stay the same version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-18 libclang-rt-18-dev
      - name: Fuzz the codec for 60 seconds
        run: make fuzz-run FUZZ_TIME=60
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            timeout-*

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y uuid-dev libsqlite3-dev
          cd tests/web && npm install
      - name: Build
        run: make
      - name: Web client in jsdom
        run: ./tests/web_ui.sh

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y uuid-dev libsqlite3-dev
      - name: TypeScript SDK against a live server
        run: ./tests/ts_sdk.sh
