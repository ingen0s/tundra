name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build: [release, asan]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y uuid-dev libsqlite3-dev
      - name: Build
        run: |
          if [ "${{ matrix.build }}" = "asan" ]; then make asan; else make; fi
      - name: Codec unit tests
        run: ./build/codec_test
      - name: Integration tests
        run: ./tests/integration.sh

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-18-dev uuid-dev libsqlite3-dev
      - name: Fuzz the codec for 60 seconds
        run: make fuzz-run FUZZ_TIME=60
